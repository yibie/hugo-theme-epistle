name: Publish approved guestbook letter to Hugo

on:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: guestbook-publication

jobs:
  publish:
    if: >-
      github.event.label.name == 'publish' &&
      contains(github.event.issue.labels.*.name, 'guestbook')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch private issue comments
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          gh api --paginate
          "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments"
          > "${RUNNER_TEMP}/guestbook-comments.json"

      - name: Require pinned guestbook publisher
        env:
          GUESTBOOK_SYSTEM_REF: ${{ vars.GUESTBOOK_SYSTEM_REF }}
        run: |
          if [[ ! "$GUESTBOOK_SYSTEM_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "GUESTBOOK_SYSTEM_REF must be a 40-character Epistle commit SHA."
            exit 1
          fi

      - name: Checkout Hugo source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ vars.BLOG_BASE_BRANCH || 'main' }}
          path: blog

      - name: Checkout Epistle guestbook publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: yibie/hugo-theme-epistle
          ref: ${{ vars.GUESTBOOK_SYSTEM_REF }}
          path: guestbook-system
          persist-credentials: false

      - name: Render approved letter
        id: render
        continue-on-error: true
        env:
          GUESTBOOK_CONTENT_DIR: ${{ vars.GUESTBOOK_CONTENT_DIR }}
          GUESTBOOK_MAINTAINERS: ${{ vars.GUESTBOOK_MAINTAINERS }}
        run: |
          node guestbook-system/packages/hugo-publisher/src/cli.mjs \
            --event "${GITHUB_EVENT_PATH}" \
            --comments "${RUNNER_TEMP}/guestbook-comments.json" \
            --output "blog/${GUESTBOOK_CONTENT_DIR:-content/guestbook}" \
            --maintainers "${GUESTBOOK_MAINTAINERS}" \
            2>"${RUNNER_TEMP}/guestbook-publish-error.txt"

      - name: Report publication failure
        if: steps.render.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            printf '%s\n\n' 'Guestbook publication was skipped:'
            head -c 1000 "${RUNNER_TEMP}/guestbook-publish-error.txt"
          } > "${RUNNER_TEMP}/guestbook-publish-comment.txt"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "${RUNNER_TEMP}/guestbook-publish-comment.txt"
          exit 1

      - name: Publish approved letter
        working-directory: blog
        env:
          GH_TOKEN: ${{ github.token }}
          BLOG_BASE_BRANCH: ${{ vars.BLOG_BASE_BRANCH }}
          GUESTBOOK_CONTENT_DIR: ${{ vars.GUESTBOOK_CONTENT_DIR }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          base="${BLOG_BASE_BRANCH:-main}"
          git config user.name "epistle-guestbook[bot]"
          git config user.email "epistle-guestbook[bot]@users.noreply.github.com"
          git add "${GUESTBOOK_CONTENT_DIR:-content/guestbook}"
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git commit \
            -m "Make approved guestbook letter #${ISSUE_NUMBER} visible" \
            -m "Generated from a maintainer-approved private guestbook issue." \
            -m "Constraint: Private email remains in the issue only" \
            -m "Confidence: high" \
            -m "Scope-risk: narrow" \
            -m "Tested: Publisher validation and deterministic content generation"
          gh auth setup-git
          git push origin "HEAD:${base}"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$base"
